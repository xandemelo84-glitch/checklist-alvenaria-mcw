<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist MCW — Residencial La Vie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#111827;font-family:Arial,Helvetica,sans-serif}
header{background:#14532d;color:#fff;padding:14px 18px}header h1{margin:0 0 5px;font-size:22px}header p{margin:0;font-size:13px}
main{max-width:1150px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d7dee5;border-radius:10px;padding:16px}
h2{margin:0 0 7px;color:#14532d}.help{margin:0 0 15px;color:#374151;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:10px}.choice{border:1px solid #b9c7c0;background:#f8fbf9;color:#14532d;border-radius:9px;padding:16px 12px;cursor:pointer;font-weight:700;text-align:left}
.choice:hover{background:#176b3a;color:#fff}.back{border:1px solid #cbd5df;background:#fff;border-radius:7px;padding:8px 11px;cursor:pointer;margin-bottom:12px}
.badge{background:#edf9f0;border:1px solid #c9ddd0;color:#14532d;border-radius:7px;padding:10px;margin-bottom:14px;font-weight:bold}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}label{font-size:12px;font-weight:bold}input,select,select:disabled{background:#eef2f5;color:#4b5563}textarea{width:100%;margin-top:4px;padding:8px;border:1px solid #cbd5df;border-radius:6px;font:inherit}textarea{min-height:58px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #d7dee5;padding:7px;vertical-align:top}th{background:#eef2f5;text-align:left}.actions{display:flex;gap:8px;margin:12px 0}
.primary{background:#176b3a;color:#fff;border:0;border-radius:7px;padding:9px 13px;cursor:pointer}.secondary{background:#fff;border:1px solid #cbd5df;border-radius:7px;padding:9px 13px;cursor:pointer}.small{font-size:11px;color:#374151}
@media(max-width:800px){.grid,.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}}
@media print{.back,.actions{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0;box-shadow:none}}

.card{color:#111827}
.card h2{color:#14532d;font-weight:800}
.card p,.help{color:#374151}
table{color:#111827}
th{color:#111827;font-weight:800}
td{color:#1f2937}
label{color:#111827;font-weight:800}
input,select,textarea{color:#111827;font-weight:500}
.small{color:#374151}
.choice{color:#14532d;font-weight:800}
.badge{color:#0f4d29;font-weight:800}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.summaryBox{border:1px solid #cbd5df;border-radius:8px;padding:10px;background:#f8fafc;text-align:center}
.summaryBox strong{display:block;font-size:20px;color:#111827}
.summaryBox span{display:block;font-size:11px;color:#374151;font-weight:700;margin-top:3px}
.summaryBar{height:9px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:7px}
.summaryFill{height:100%;background:#14532d;width:0}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}

.mcw-brand{
  display:flex;align-items:center;gap:18px;
  background:#ffffff;border-bottom:3px solid #14532d;
  padding:10px 18px;min-height:76px;
}
.mcw-logo{width:150px;height:64px;object-fit:contain;object-position:left center}
.mcw-brand-title{color:#14532d;font-weight:800;font-size:21px;line-height:1.15}
.mcw-brand-sub{color:#111827;font-size:12px;font-weight:700;margin-top:5px}
@media print{.mcw-brand{border-bottom:2px solid #14532d}}
.roomChoices{display:flex;flex-direction:column;gap:4px;margin-top:5px}.roomChoices select{width:100%;font-size:11px;padding:3px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head><body>

let state={screen:"services",service:"",floorKey:"",floor:"",area:""};

function esc(v){return String(v??"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function service(){return SERVICES.find(function(s){return s[0]===state.service})}
function floor(){return FLOORS.find(function(f){return f.key===state.floorKey})}
function isFloorOnlyService(){return state.service==="ppci"||state.service==="acabamento_escadas"}
function key(){return "LAVIE|"+state.service+"|"+state.floorKey+"|"+state.area.replace(/[^A-Za-z0-9]+/g,"_")}

function initialRows(){
 return (CHECKS[state.service]||[]).map(function(x,i){
  return {n:i+1,item:x[0],detail:x[1],criterion:x[2],status:"",nc:"Selecione a não conformidade",room1:"",room2:"",room3:"",obs:""};
 });
}
function getRows(){
 let rows=null;
 try{const r=localStorage.getItem(key());if(r){const p=JSON.parse(r);if(Array.isArray(p.rows))rows=p.rows}}catch(e){}
 if(!rows)rows=initialRows();
 rows.forEach(function(r){if(!r.nc)r.nc="Selecione a não conformidade";if(r.room1===undefined)r.room1="";if(r.room2===undefined)r.room2="";if(r.room3===undefined)r.room3="";});
 return rows;
}
function getFichaMeta(){
 try{
  const raw=localStorage.getItem(key()+"__meta");
  if(raw)return JSON.parse(raw);
 }catch(e){}
 return {date:"",responsible:""};
}
function saveFichaMeta(){
 const date=document.getElementById("inspectionDate")?.value||"";
 const responsible=document.getElementById("inspectionResponsible")?.value||"";
 localStorage.setItem(key()+"__meta",JSON.stringify({date:date,responsible:responsible}));
}
function saveCurrent(){
 if(state.screen==="sheet")saveFichaMeta();
 if(state.screen!=="sheet")return;
 const rows=getRows();
 document.querySelectorAll("[data-i]").forEach(function(el){rows[Number(el.dataset.i)][el.dataset.f]=el.value});
 localStorage.setItem(key(),JSON.stringify({work:WORK,service:state.service,floorKey:state.floorKey,floor:state.floor,area:state.area,rows:rows,updated:new Date().toISOString()}));
}
function goServices(){saveCurrent();state={screen:"services",service:"",floorKey:"",floor:"",area:""};render()}
function chooseService(s){saveCurrent();state.service=s;state.screen="floors";render()}
function chooseFloor(k){saveCurrent();const f=FLOORS.find(function(x){return x.key===k});state.floorKey=f.key;state.floor=f.label;if(isFloorOnlyService()){state.area="PAVIMENTO";state.screen="sheet";render();loadCloudCurrent()}else{state.area="";state.screen="areas";render()}}
function chooseArea(a){saveCurrent();state.area=a;state.screen="sheet";render();loadCloudCurrent()}
function backFloors(){saveCurrent();state.floorKey="";state.floor="";state.area="";state.screen="floors";render()}
function backAreas(){saveCurrent();state.area="";state.screen=isFloorOnlyService()?"floors":"areas";render()}
function saveFicha(){saveCurrent();saveFichaMeta();alert("Ficha de verificação salva.")}
function printFicha(){saveCurrent();saveFichaMeta();window.print()}

function updateSummary(){
 const selects=document.querySelectorAll('select[data-f="status"]');
 let c=0,nc=0,na=0,p=0,total=selects.length;
 selects.forEach(function(s){if(s.value==="C")c++;else if(s.value==="NC")nc++;else if(s.value==="NA")na++;else p++;});
 function pct(n){return total?Math.round(n*1000/total)/10:0}
 [["C",c],["NC",nc],["NA",na],["P",p]].forEach(function(x){
   const id=x[0],v=pct(x[1]);
   const el=document.getElementById("pct"+id),bar=document.getElementById("bar"+id);
   if(el)el.textContent=v+"%";
   if(bar)bar.style.width=v+"%";
 });
}
function toggleNC(i,value){
 const el=document.getElementById("nc_"+i);
 if(el){el.disabled=value!=="NC";if(value!=="NC")el.value="Selecione a não conformidade";}
 ["room1","room2","room3"].forEach(function(k){
   const r=document.getElementById(k+"_"+i);
   if(r){r.disabled=value!=="NC";if(value!=="NC")r.value="";}
 });
}
function render(){
 let content=state.screen==="services"?servicesScreen():state.screen==="floors"?floorsScreen():state.screen==="areas"?areasScreen():sheetScreen();
 document.getElementById("app").innerHTML=content;
 const s=service(),f=floor();
 document.getElementById("title").textContent=state.screen==="sheet"&&s?"Ficha de Verificação":"Checklist MCW";
 document.getElementById("subtitle").textContent=state.screen==="sheet"&&s?WORK+" • "+s[2]+" • "+f.label+" • "+state.area:WORK;
 if(state.screen==="sheet")updateSummary();
}
render();

async function testCloud(){
  const url=document.getElementById("mcwUrl").value.trim().replace(/\/$/,""),keyv=document.getElementById("mcwKey").value.trim(),msg=document.getElementById("mcwCloudMsg");
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!keyv){msg.textContent="Informe URL e Publishable key válidas.";return}
  msg.textContent="Testando...";
  try{const c=supabase.createClient(url,keyv,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const r=await c.from("checklist_projects").select("id").limit(1);
    if(r.error){msg.textContent="Tabela checklist_projects não disponível: "+r.error.message;return}
    saveCfg({url,key:keyv});sb=c;msg.textContent="✓ Conexão funcionando.";setTimeout(()=>{document.getElementById("mcwCloudModal")?.remove();startCloud()},500);
  }catch(e){msg.textContent="Erro: "+e.message}
}

 if(document.getElementById("mcwLoginModal"))return;
 const m=document.createElement("div");m.id="mcwLoginModal";m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99998;padding:15px";
 m.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;width:min(390px,95vw);font-family:Arial,sans-serif"><h2 style="margin:0;color:#176b3a">Checklist MCW</h2><p style="font-size:13px">Entre com seu e-mail e senha.</p><input id="mcwEmail" type="email" placeholder="E-mail" style="width:100%;padding:10px;box-sizing:border-box;margin:5px 0"><input id="mcwPass" type="password" placeholder="Senha" style="width:100%;padding:10px;box-sizing:border-box;margin:5px 0"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="primary" onclick="doLogin()">Entrar</button><button class="secondary" onclick="doSignup()">Criar conta</button><button class="secondary" onclick="cloudModal()">Configurar nuvem</button></div><div id="mcwLoginMsg" style="font-size:12px;margin-top:10px"></div></div>';
 document.body.appendChild(m);
}
async function doLogin(){
 const email=document.getElementById("mcwEmail").value.trim(),password=document.getElementById("mcwPass").value,msg=document.getElementById("mcwLoginMsg");
 if(!email||!password){msg.textContent="Informe e-mail e senha.";return}
 msg.textContent="Entrando...";
 const r=await sb.auth.signInWithPassword({email,password});if(r.error){msg.textContent="Não foi possível entrar: "+r.error.message;return}
 sbUser=r.data.user;document.getElementById("mcwLoginModal").remove();await loadCloudCurrent();
}
async function doSignup(){
 const email=document.getElementById("mcwEmail").value.trim(),password=document.getElementById("mcwPass").value,msg=document.getElementById("mcwLoginMsg");
 if(!email||!password){msg.textContent="Informe e-mail e senha.";return} if(password.length<6){msg.textContent="A senha deve ter pelo menos 6 caracteres.";return}
 msg.textContent="Criando conta...";const r=await sb.auth.signUp({email,password});
 if(r.error){msg.textContent=r.error.message;return} msg.textContent=r.data.session?"Conta criada.":"Confirme o e-mail recebido.";
 if(r.data.session){sbUser=r.data.user;document.getElementById("mcwLoginModal").remove();await loadCloudCurrent()}
}
async function loadCloudCurrent(){
 if(!sb||!sbUser||state.screen!=="sheet"||sbLoading)return;
 sbLoading=true;cloudStatus("☁️ Carregando...");
 try{
  const r=await sb.from("checklist_projects").select("id,data").eq("user_id",sbUser.id).eq("project_key",cloudKey()).maybeSingle();
  if(r.error)throw r.error;
  if(r.data){sbProjectId=r.data.id;const d=r.data.data||{};if(Array.isArray(d.rows)){localStorage.setItem(key(),JSON.stringify(d));render()}}
  cloudStatus("✓ Sincronizado");
 }catch(e){cloudStatus("⚠ Falha ao carregar",true)}finally{sbLoading=false}
}
async function cloudSaveCurrent(){
 if(!sb||!sbUser||state.screen!=="sheet")return;
 const data={work:WORK,service:state.service,floorKey:state.floorKey,floor:state.floor,area:state.area,rows:getRows(),meta:getFichaMeta(),updated:new Date().toISOString()};
 const payload={user_id:sbUser.id,project_key:cloudKey(),data,updated_at:new Date().toISOString()};
 let r=sbProjectId?await sb.from("checklist_projects").update(payload).eq("id",sbProjectId).select("id").single():await sb.from("checklist_projects").upsert(payload,{onConflict:"user_id,project_key"}).select("id").single();
 if(r.error){cloudStatus("⚠ Falha ao salvar",true);return} sbProjectId=r.data.id;cloudStatus("✓ Sincronizado");
}
async function startCloud(){
 const c=cfg();if(!c){cloudStatus("☁️ Nuvem não configurada");return}
 try{sb=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const s=await sb.auth.getSession();if(s.data.session){sbUser=s.data.session.user;cloudStatus("☁️ Conectado")}else cloudStatus("☁️ Login necessário")}catch(e){cloudStatus("⚠ Configuração inválida",true)}
}
function saveCurrent(){
 if(state.screen!=="sheet")return;
 const rows=getRows();document.querySelectorAll("[data-i]").forEach(el=>{rows[Number(el.dataset.i)][el.dataset.f]=el.value});
 localStorage.setItem(key(),JSON.stringify({work:WORK,service:state.service,floorKey:state.floorKey,floor:state.floor,area:state.area,rows,meta:getFichaMeta(),updated:new Date().toISOString()}));
 cloudSaveCurrent();
}
function chooseAreaCloud(a){state.area=a;state.screen="sheet";render();loadCloudCurrent()}
function chooseFloorCloud(k){const f=FLOORS.find(x=>x.key===k);state.floorKey=f.key;state.floor=f.label;if(isFloorOnlyService()){state.area="PAVIMENTO";state.screen="sheet";render();loadCloudCurrent()}else{state.area="";state.screen="areas";render()}}
</script></body></html>
